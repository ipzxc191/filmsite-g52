{% extends 'base.html' %}

{% block title %}
    {% if object%}
    Изменить фильм
    {% else %}
    Добавить фильм
    {% endif %}
{% endblock %}

{% block content %}
    {% if object %}
        <h1>Редактировать фильм</h1>
    {% else %}
        <h1>Добавить новый фильм</h1>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить</button>
    </form>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Удалить {{ film.title }}{% endblock %}

{% block content %}
    <h1>Удалить фильм?</h1>
    <p>Вы уверены, что хотите удалить «{{ film.title }}»? Это действие необратимо.</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">Да, удалить</button>
        <a href="{{ film.get_absolute_url }}">Отменить</a>
    </form>
{% endblock %}
